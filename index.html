<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Campagnes | Irisolaris Store</title>
  <style>
    :root {
      --blue-brand: #2377ff;
      --blue-dark: #06244c;
      --gray-50: #f4f7fb;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--blue-dark);
      background: linear-gradient(160deg, var(--gray-50) 0%, #dbe7f8 100%);
    }
    main {
      width: min(100% - 2rem, 420px);
      padding: 2rem;
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(6, 36, 76, 0.1);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 1.5rem;
      color: #5a6b7d;
      font-size: 0.95rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.75rem;
    }
    a {
      display: block;
      padding: 0.9rem 1rem;
      border: 1px solid #e8eef6;
      border-radius: 10px;
      color: var(--blue-brand);
      font-weight: 600;
      text-decoration: none;
    }
    a:hover {
      background: var(--gray-50);
      border-color: var(--blue-brand);
    }
  </style>
</head>
<body>
  <main>
    <h1>Irisolaris Store</h1>
    <p>Campagnes landing pages</p>
    <ul>
      <li><a href="climatisation/">Climatisation</a></li>
      <li><a href="piscine/">PAC Piscine</a></li>
      <li><a href="photovoltaique/">Photovoltaïque</a></li>
    </ul>
  </main>
</body>
</html>
